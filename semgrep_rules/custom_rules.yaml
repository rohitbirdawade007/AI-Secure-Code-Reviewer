rules:

  # ── SQL Injection ──────────────────────────────────────────────────────────
  - id: custom-sql-injection
    pattern-either:
      - pattern: $DB.execute("..." + $VAR)
      - pattern: $DB.execute($QUERY + $VAR)
      - patterns:
          - pattern: |
              $QUERY = $PREFIX + $VAR
              ...
              $DB.execute($QUERY)
          - pattern-not: $DB.execute("...")
    message: |
      Potential SQL Injection: user-controlled data passed directly into a SQL query.
      Use parameterized queries: cursor.execute("SELECT * FROM t WHERE id = ?", (val,))
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: security

  # ── Command Injection ──────────────────────────────────────────────────────
  - id: custom-command-injection
    pattern-either:
      - pattern: os.system($CMD)
      - pattern: os.popen($CMD)
      - pattern: subprocess.call($CMD, shell=True)
      - pattern: subprocess.run($CMD, shell=True)
      - pattern: subprocess.Popen($CMD, shell=True)
    message: |
      Potential Command Injection: user input may be passed to a shell command.
      Avoid shell=True and pass arguments as a list instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: security

  # ── Hardcoded Passwords / Secrets ─────────────────────────────────────────
  - id: custom-hardcoded-password
    pattern-either:
      - pattern: password = "..."
      - pattern: passwd = "..."
      - pattern: secret = "..."
      - pattern: api_key = "..."
      - pattern: token = "..."
      - pattern: PASSWORD = "..."
      - pattern: SECRET_KEY = "..."
    message: |
      Hardcoded secret detected. Move credentials to environment variables
      and load them with os.environ or python-dotenv.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security

  # ── Path Traversal ────────────────────────────────────────────────────────
  - id: custom-path-traversal
    pattern-either:
      - pattern: open($BASE + $USERVAL)
      - pattern: open(os.path.join($BASE, $USERVAL))
      - patterns:
          - pattern: open($PATH)
          - pattern-not: open("...")
    message: |
      Potential Path Traversal: a variable is used directly in a file open call.
      Validate and sanitize the path and restrict it to an allowed base directory.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      category: security

  # ── Insecure Deserialization ──────────────────────────────────────────────
  - id: custom-insecure-pickle
    pattern-either:
      - pattern: pickle.loads($DATA)
      - pattern: pickle.load($FILE)
      - pattern: cPickle.loads($DATA)
      - pattern: cPickle.load($FILE)
    message: |
      Insecure Deserialization via pickle. Never deserialize untrusted data with pickle.
      Use json.loads() or another safe format for untrusted input.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: security

  # ── Weak Hashing ──────────────────────────────────────────────────────────
  - id: custom-weak-hash
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
      - pattern: md5(...)
    message: |
      Weak cryptographic hash function (MD5/SHA1) detected.
      Use SHA-256 or SHA-3 for security-sensitive hashing.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  # ── Insecure Random ───────────────────────────────────────────────────────
  - id: custom-insecure-random
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
      - pattern: random.randrange(...)
    message: |
      Cryptographically weak PRNG used. For security tokens/passwords,
      use secrets.token_hex() or secrets.token_bytes() instead.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  # ── Flask Debug Mode ──────────────────────────────────────────────────────
  - id: custom-flask-debug-true
    pattern: app.run(..., debug=True, ...)
    message: |
      Flask debug=True must never be used in production.
      It exposes the interactive debugger and allows arbitrary code execution.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security

  # ── Use of eval ───────────────────────────────────────────────────────────
  - id: custom-eval-injection
    pattern-either:
      - pattern: eval($CODE)
      - pattern: exec($CODE)
    message: |
      Use of eval()/exec() with a variable is dangerous and can allow
      arbitrary code execution if user input reaches it.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      category: security
