rules:

  # ── SQL Injection ──────────────────────────────────────────────────────────
  - id: custom-sql-injection
    patterns:
      - pattern: |
          $DB.execute("..." + $VAR)
      - pattern: |
          $DB.execute(f"...{$VAR}...")
    message: |
      Potential SQL Injection: user-controlled data passed directly into a SQL query.
      Use parameterized queries instead: cursor.execute("SELECT * FROM t WHERE id = ?", (val,))
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: security

  # ── Command Injection ──────────────────────────────────────────────────────
  - id: custom-command-injection
    patterns:
      - pattern: os.system($VAR)
      - pattern: subprocess.call($VAR, shell=True)
      - pattern: subprocess.run($VAR, shell=True)
      - pattern: os.popen($VAR)
    message: |
      Potential Command Injection: user input passed to a shell command.
      Avoid shell=True and use a list of arguments instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: security

  # ── Hardcoded Passwords ───────────────────────────────────────────────────
  - id: custom-hardcoded-password
    patterns:
      - pattern: password = "..."
      - pattern: passwd = "..."
      - pattern: secret = "..."
      - pattern: api_key = "..."
    message: |
      Hardcoded secret detected. Move credentials to environment variables
      and load them with os.environ or python-dotenv.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      category: security

  # ── Path Traversal ────────────────────────────────────────────────────────
  - id: custom-path-traversal
    patterns:
      - pattern: open($VAR)
      - pattern: open(os.path.join(..., $VAR))
    message: |
      Potential Path Traversal: user-controlled variable used in file open.
      Validate and sanitize the path, and restrict it to an allowed directory.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      category: security

  # ── Insecure Deserialization ──────────────────────────────────────────────
  - id: custom-insecure-pickle
    patterns:
      - pattern: pickle.loads($DATA)
      - pattern: pickle.load($FILE)
    message: |
      Insecure Deserialization via pickle. Never deserialize untrusted data with pickle.
      Use safe alternatives like json.loads() for untrusted input.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: security

  # ── Weak Hashing ──────────────────────────────────────────────────────────
  - id: custom-weak-hash
    patterns:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: |
      Weak cryptographic hash function used (MD5/SHA1).
      Use SHA-256 or SHA-3 for security-sensitive hashing.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  # ── Insecure Random ───────────────────────────────────────────────────────
  - id: custom-insecure-random
    patterns:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: random.choice(...)
    message: |
      Insecure pseudo-random number generator used.
      For security purposes (tokens, passwords), use secrets.token_hex() or secrets.token_bytes().
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security

  # ── Debug Mode in Flask ───────────────────────────────────────────────────
  - id: custom-flask-debug-true
    pattern: app.run(..., debug=True, ...)
    message: |
      Flask debug mode is enabled. Never run with debug=True in production —
      it exposes the interactive debugger and allows arbitrary code execution.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-489: Active Debug Code"
      owasp: "A05:2021 - Security Misconfiguration"
      category: security
